name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Publish packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm --filter @stackline/ai publish --access public --provenance --no-git-checks
          pnpm --filter @stackline/ai-server publish --access public --provenance --no-git-checks
          pnpm --filter @stackline/ai-ollama publish --access public --provenance --no-git-checks
          pnpm --filter @stackline/ai-memory-sqlite publish --access public --provenance --no-git-checks
          pnpm --filter @stackline/ai-rag-postgres publish --access public --provenance --no-git-checks
          pnpm --filter @stackline/ai-ui publish --access public --provenance --no-git-checks
