name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      expected_manifest_sha512:
        description: SHA-512 hex digest of release-artifacts/SHA512SUMS
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish six packages with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.2.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Require the default branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run pack:release
      - run: node scripts/consumer-smoke.mjs release-artifacts
      - name: Reject existing public versions
        shell: bash
        run: |
          for archive in release-artifacts/*.tgz; do
            manifest="$(tar -xOf "$archive" package/package.json)"
            package="$(node -e 'const input=[]; process.stdin.on("data", c => input.push(c)); process.stdin.on("end", () => process.stdout.write(JSON.parse(Buffer.concat(input)).name));' <<<"$manifest")"
            version="$(node -e 'const input=[]; process.stdin.on("data", c => input.push(c)); process.stdin.on("end", () => process.stdout.write(JSON.parse(Buffer.concat(input)).version));' <<<"$manifest")"
            if npm view "$package@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$package@$version already exists" >&2
              exit 1
            fi
          done
      - name: Verify the immutable artifact manifest
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA512: ${{ inputs.expected_manifest_sha512 }}
        run: |
          expected="$(printf '%s' "$EXPECTED_MANIFEST_SHA512" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          actual="$(sha512sum release-artifacts/SHA512SUMS | awk '{print $1}')"
          if [[ ! "$expected" =~ ^[0-9a-f]{128}$ ]]; then
            echo "expected_manifest_sha512 must contain exactly 128 hexadecimal characters" >&2
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "Artifact manifest digest mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          (cd release-artifacts && sha512sum --check SHA512SUMS)
      - run: npm install --global npm@11.19.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: release-artifacts/
          if-no-files-found: error
      - name: Publish packages through OIDC
        shell: bash
        run: |
          for archive in release-artifacts/*.tgz; do
            npm publish "$archive" --access public --provenance --registry=https://registry.npmjs.org
          done
